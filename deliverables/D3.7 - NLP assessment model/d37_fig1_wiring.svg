<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-label="The ready to use wiring on EDITO: the chat interface calls the language model and both SURIMI servers over MCP; any other MCP client attaches to the data server at /sse.">
  <title>The ready to use wiring on EDITO</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#44515E"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" fill="#1B2733">
    <rect x="0" y="0" width="960" height="560" fill="#FFFFFF"/>

    <!-- EDITO boundary -->
    <rect x="24" y="24" width="912" height="392" rx="12" fill="#F3F6F9" stroke="#C3CDD7" stroke-width="1.25"/>
    <text x="48" y="56" font-size="15" font-weight="700" letter-spacing="0.6">EDITO</text>
    <text x="104" y="56" font-size="14" fill="#5B6B7A">ready to use wiring, launched from the catalogue</text>

    <!-- Chat interface -->
    <rect x="64" y="80" width="360" height="116" rx="8" fill="#FFFFFF" stroke="#AEBBC7" stroke-width="1.25"/>
    <text x="84" y="108" font-size="16" font-weight="700">SURIMI-vllm-ui</text>
    <text x="84" y="130" font-size="13" fill="#5B6B7A">Chat interface</text>
    <text x="84" y="156" font-size="12" fill="#3D4A57">open-webui 0.11.1 · chart 0.2.79</text>
    <text x="84" y="178" font-size="12" fill="#3D4A57">SURIMI assistant, system prompt, both servers</text>

    <!-- Language model -->
    <rect x="536" y="80" width="360" height="116" rx="8" fill="#FFFFFF" stroke="#AEBBC7" stroke-width="1.25"/>
    <text x="556" y="108" font-size="16" font-weight="700">SURIMI-vllm</text>
    <text x="556" y="130" font-size="13" fill="#5B6B7A">Language model serving</text>
    <text x="556" y="156" font-size="12" fill="#3D4A57">vLLM 0.29.0 · chart 0.2.6</text>
    <text x="556" y="178" font-size="12" fill="#3D4A57">Muse-Glimmer-30B on the EDITO GPU node</text>

    <!-- UI to model -->
    <line x1="424" y1="138" x2="534" y2="138" stroke="#44515E" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="480" y="128" font-size="12" fill="#44515E" text-anchor="middle">prompts</text>

    <!-- UI to both servers -->
    <line x1="244" y1="196" x2="244" y2="274" stroke="#44515E" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M244,236 H716 V274" fill="none" stroke="#44515E" stroke-width="1.5" marker-end="url(#arrow)"/>
    <circle cx="244" cy="236" r="3" fill="#44515E"/>
    <text x="480" y="228" font-size="12" fill="#44515E" text-anchor="middle">tool calls over MCP</text>

    <!-- Data server, D3.7 -->
    <rect x="64" y="276" width="360" height="116" rx="8" fill="#EAF2FA" stroke="#1F6FB2" stroke-width="1.75"/>
    <text x="84" y="304" font-size="16" font-weight="700">SURIMI-data-mcp</text>
    <rect x="362" y="290" width="46" height="22" rx="11" fill="#1F6FB2"/>
    <text x="385" y="305" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">D3.7</text>
    <text x="84" y="326" font-size="13" fill="#5B6B7A">NLP assessment model</text>
    <text x="84" y="352" font-size="12" fill="#3D4A57">image 1.2.42 · endpoint /sse</text>
    <text x="84" y="374" font-size="12" fill="#3D4A57">tabular data lake</text>

    <!-- Model server, D3.9 -->
    <rect x="536" y="276" width="360" height="116" rx="8" fill="#EAF2FA" stroke="#1F6FB2" stroke-width="1.75"/>
    <text x="556" y="304" font-size="16" font-weight="700">SURIMI-model-mcp</text>
    <rect x="834" y="290" width="46" height="22" rx="11" fill="#1F6FB2"/>
    <text x="857" y="305" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">D3.9</text>
    <text x="556" y="326" font-size="13" fill="#5B6B7A">NLP policy model</text>
    <text x="556" y="352" font-size="12" fill="#3D4A57">image 1.2.11 · endpoint /mcp</text>
    <text x="556" y="374" font-size="12" fill="#3D4A57">simulation runs and gridded forcing</text>

    <!-- Any other MCP client, outside EDITO -->
    <rect x="64" y="452" width="360" height="84" rx="8" fill="#FFFFFF" stroke="#AEBBC7" stroke-width="1.25" stroke-dasharray="5 4"/>
    <text x="84" y="480" font-size="16" font-weight="700">Any other MCP client</text>
    <text x="84" y="502" font-size="12" fill="#3D4A57">Claude.ai, Claude Desktop, ChatGPT connector,</text>
    <text x="84" y="520" font-size="12" fill="#3D4A57">Mistral Chat, opencode</text>
    <line x1="244" y1="452" x2="244" y2="394" stroke="#44515E" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="256" y="438" font-size="12" fill="#44515E">attach to /sse</text>
  </g>
</svg>

name: Sync Architecture Docs

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install PyGithub

      - name: Sync wiki
        env:
          SURIMI_SYNC_ARCH_DOCS_TOKEN: ${{ secrets.SURIMI_SYNC_ARCH_DOCS_TOKEN }}
        run: python sync.py
